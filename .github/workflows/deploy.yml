name: Build & Deploy Payment Gateway to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: payment-gateway
  CONTAINER_NAME: payment-gateway
  APP_PORT: 3005

jobs:
  # Compile check, the only job that runs on a pull request
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -e

          echo "🚀 Starting deployment..."

          ########################
          # Variables
          ########################
          WORKDIR="$HOME/payment-gateway/production"
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
          APP_PORT="${{ env.APP_PORT }}"

          ########################
          # Cleanup on exit
          ########################
          cleanup() {
            if [ "$?" -eq 0 ]; then
              echo "🧹 Cleaning up production folder..."
              rm -rf "$WORKDIR"
              echo "✅ Cleanup completed"
            else
              echo "❌ Deployment failed. Keeping current production for investigation."
            fi
          }

          trap cleanup EXIT

          ########################
          # Prepare folder
          ########################
          if [ -d "$WORKDIR" ]; then
            rm -rf "$WORKDIR"
          fi
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          echo "📁 Working directory: $WORKDIR"

          ########################
          # Write env file
          ########################
          echo "🔐 Writing env file..."

          cat > sale-service.env << 'ENV'
          ${{ secrets.PROD_SALE_SERVICE_ENV }}
          ENV
          chmod 600 sale-service.env

          echo "✅ Env file created"

          ########################
          # Pull image
          ########################
          echo "📦 Pulling Docker image..."

          docker pull "$IMAGE"

          ########################
          # Start service
          ########################
          echo "🚀 Starting service..."

          docker rm -f "$CONTAINER_NAME" || true
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file sale-service.env \
            -e PORT="$APP_PORT" \
            -p "$APP_PORT:$APP_PORT" \
            "$IMAGE"

          ########################
          # Wait for health check
          ########################
          echo "⏳ Waiting for the service to become healthy..."

          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME")
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            sleep 5
          done

          echo "📊 Service status:"
          docker ps --filter "name=$CONTAINER_NAME"

          if [ "$STATUS" != "healthy" ]; then
            echo "❌ Service is $STATUS"
            docker logs --tail 50 "$CONTAINER_NAME"
            exit 1
          fi

          echo "🎉 Deployment completed successfully!"
          EOF
